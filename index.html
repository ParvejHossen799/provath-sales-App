<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রভাত এসই সামারি - দৈনিক ও মাসিক বিক্রয় হিসাব</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --mygp-blue: #0077FF;
            --mygp-cyan: #00C6FF;
            --deep-navy: #091E42;
            --royal-blue: #0052CC;
        }
        * {
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(180deg, #E0F2FE 0%, #F1F5F9 100%);
            color: #0F172A;
            padding: 10px;
            min-height: 100vh;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
            background: #FFFFFF;
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(9, 30, 66, 0.16);
            overflow: hidden;
            border: 1px solid #BAE6FD;
        }
        .header {
            background: linear-gradient(135deg, var(--mygp-blue), var(--mygp-cyan));
            color: #FFFFFF;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
        }
        .header-title p {
            font-size: 12px;
            opacity: 0.95;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .top-btn {
            background: rgba(255, 255, 255, 0.22);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .mini-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #FACC15;
        }
        .section {
            padding: 14px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px;
            color: #0F172A;
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1.5px solid #CBD5E1;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            background: #FFFFFF;
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--mygp-blue);
            box-shadow: 0 0 0 3px rgba(0, 119, 255, 0.12);
        }
        input[readonly] {
            background: #F1F5F9;
            color: #334155;
            cursor: not-allowed;
        }
        .profile-alert-banner {
            background: #FEF2F2;
            border: 1.5px solid #FCA5A5;
            color: #991B1B;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .profile-alert-banner button {
            background: #DC2626;
            color: #FFFFFF;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .locked-badge {
            display: inline-block;
            background: #DCFCE7;
            color: #166534;
            border: 1px solid #86EFAC;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .restore-box {
            background: #FEF9C3;
            border: 1.5px solid #FACC15;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .restore-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-top: 5px;
        }
        .btn-restore {
            background: #0F172A;
            color: #FACC15;
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .product-card {
            background: linear-gradient(135deg, #0077FF 0%, #00A8FF 100%);
            padding: 10px;
            border-radius: 14px;
            margin: 10px 0;
            box-shadow: 0 6px 16px rgba(0, 119, 255, 0.2);
        }
        .product-card-title {
            color: #FFFFFF;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #FFFFFF;
            border-radius: 10px;
            overflow: hidden;
        }
        th {
            background: #091E42;
            color: #FFFFFF;
            padding: 7px 6px;
            font-size: 13px;
            font-weight: 700;
            text-align: left;
        }
        th:nth-child(2), td:nth-child(2) {
            text-align: center;
            width: 112px;
        }
        th:nth-child(3), td:nth-child(3) {
            text-align: right;
            width: 108px;
        }
        th:nth-child(4), td:nth-child(4) {
            text-align: center;
            width: 34px;
        }
        td {
            padding: 6px;
            border-bottom: 1px solid #E2E8F0;
            font-size: 14px;
            font-weight: 700;
        }
        tr:nth-child(even) {
            background-color: #F0F9FF;
        }
        .qty-input {
            width: 102px;
            text-align: center;
            padding: 5px 4px;
            border: 1.5px solid #93C5FD;
            font-weight: 700;
            font-size: 14px;
            color: #0052CC;
        }
        .btn-del-row {
            background: #FEE2E2;
            color: #DC2626;
            border: none;
            border-radius: 6px;
            width: 26px;
            height: 28px;
            font-weight: 700;
            cursor: pointer;
        }
        .bank-section {
            background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%);
            border: 1.5px solid #7DD3FC;
            border-radius: 14px;
            padding: 12px;
            margin: 12px 0;
        }
        .bank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .bank-header h3 {
            font-size: 15px;
            color: #0369A1;
            font-weight: 700;
        }
        .badge {
            background: #0052CC;
            color: #FFFFFF;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .bank-card-item {
            background: #FFFFFF;
            border: 1px solid #BAE6FD;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .bank-row {
            display: grid;
            grid-template-columns: 1.35fr 1fr 32px;
            gap: 6px;
            align-items: end;
        }
        .btn-remove {
            background: #FEE2E2;
            color: #DC2626;
            border: none;
            border-radius: 8px;
            height: 36px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-add-bank {
            background: #FFFFFF;
            color: #0052CC;
            border: 1.5px dashed #0052CC;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }
        .summary-card-bottom {
            background: linear-gradient(135deg, #091E42 0%, #0052CC 100%);
            color: #FFFFFF;
            padding: 14px;
            border-radius: 14px;
            margin: 12px 0;
        }
        .sum-line {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .sum-line.highlight {
            border-top: 1px dashed rgba(255,255,255,0.35);
            padding-top: 8px;
            margin-top: 6px;
            margin-bottom: 0;
            font-size: 18px;
            font-weight: 700;
            color: #FACC15;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .btn {
            flex: 1;
            min-width: 110px;
            padding: 11px 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #091E42, #0052CC);
            color: #FFFFFF;
        }
        .btn-secondary {
            background: #E2E8F0;
            color: #0F172A;
